<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Translate &amp; Learn</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="game-page">
    <header>
        <nav>
            <img src="img\Logo.png" height="65">
        </nav>
    </header>
    <main>
        <div>
            <img src="img\this.jpeg" alt="">
        </div>
        <div class="game">
            <div class="senbox">
                <p class="sen">मला दररोज सकाळी व्यायाम करायला आवडते.</p>
            </div>
            <div class="ans">
                <form>   
                    <textarea id="answer" rows="4" cols="50" placeholder="Type your answer here..."></textarea>
                </form>

            </div>
            <div class="button">
                <button id="checkBtn" onclick="nextSentence()">Check</button>
            </div>
        </div>
        <div class="score">
            <h1>🏆SCORE BOARD🏆</h1>
            <H2>Correct = <span id="correct">0</span></H2>
            <H2>Incorrect = <span id="incorrect">0</span></H2>
            <p class="a"></p>
            <p class="feedback" aria-live="polite"></p>
            <div class="emoji"></div>
        </div>
    </main>
    <footer></footer>
    <script src="sript.js"></script>
</body>

</html>
